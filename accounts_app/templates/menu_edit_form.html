{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Menu{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">

            <!-- Edit Menu Form -->
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-primary text-white rounded-top-4">
                    <h4 class="mb-0">
                        <i class="bi bi-pencil-square me-2"></i> Edit Menu
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST" class="row g-3 align-items-center">
                        {% csrf_token %}
                        <div class="col-md-6">
                        <label class="form-label fw-semibold">{{ form.name.label }}</label>
                        <input type="text" 
                            name="{{ form.name.name }}" 
                            value="{{ form.name.value|default:'' }}" 
                            class="form-control" 
                            placeholder="Enter menu name" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">{{ form.url.label }}</label>
                        <input type="text" 
                            name="{{ form.url.name }}" 
                            value="{{ form.url.value|default:'' }}" 
                            class="form-control" 
                            placeholder="Enter menu URL (e.g., sales/, purchase/)" required>
                    </div>
                        <div class="col-md-6 d-flex align-items-end gap-2">
                            <button class="btn btn-success w-50" type="submit">
                                <i class="bi bi-save me-1"></i> Update
                            </button>
                            <a href="{% url 'accounts_app:menu_list_create' %}" class="btn btn-secondary w-50">
                                <i class="bi bi-arrow-left me-1"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
