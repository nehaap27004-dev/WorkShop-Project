{% extends 'fleet_base1.html' %}
{% load i18n %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card shadow-sm border-0 mx-auto p-5" style="max-width: 600px; border-radius: 16px;">
        <div class="mb-4">
            <i class="bi bi-shield-x text-danger" style="font-size: 5rem;"></i>
        </div>
        <h2 class="font-weight-bold text-dark mb-2">{% trans "Access Denied" %}</h2>
        <p class="text-muted mb-4">
            {% trans "You do not have permission to access this module. Please contact your system administrator if you believe this is an error." %}
        </p>
        <div>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 mr-2">
                <i class="bi bi-arrow-left mr-1"></i> {% trans "Go Back" %}
            </a>
            <a href="{% url 'fleet_app:fleet_home' %}" class="btn btn-primary px-4">
                <i class="bi bi-house-door mr-1"></i> {% trans "Dashboard" %}
            </a>
        </div>
    </div>
</div>
{% endblock %}
