{% extends 'base.html' %}

{% block content %}
<style>
    
    .form-container {
        max-width: 600px;
        margin: 50px auto;
        background: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
    }
    .form-container h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #343a40;
    }
    .btn-primary {
        width: 100%;
    }
</style>
</head>
<body>

<div class="form-container">
<h2>Journal Entry Form</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
</div>
{% endblock %}
