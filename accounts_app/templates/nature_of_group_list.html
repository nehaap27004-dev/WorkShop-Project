{% extends 'base.html' %}

{% block content %}
    <style>
        

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        td {
            color: #555;
        }

       
    </style>

    <h2>Nature Of Groups</h2>
   
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            {% for nature_of_group in nature_of_groups %}
            <tr>
                <td>{{ nature_of_group.nature_of_group_name }}</td>
                <td>{{ nature_of_group.nature_of_group_description }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% endblock %}
