<!-- templates/fleetquotation_list.html -->
{% extends 'fleet_base1.html' %}
{% block content %}
<h1>Fleet Quotations</h1>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Quotation No</th>
            <th>Date</th>
            <th>Company</th>
            <th>Customer</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
    {% for q in quotations %}
        <tr>
            <td>{{ q.quotation_no }}</td>
            <td>{{ q.date }}</td>
            <td>{{ q.company_name }}</td>
            <td>{{ q.customer }}</td>
            <td><a href="{% url 'fleet_app:fleetquotation_edit' q.pk %}" class="btn btn-primary btn-sm">Edit</a></td>
        </tr>
    {% empty %}
        <tr><td colspan="5">No quotations found.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
