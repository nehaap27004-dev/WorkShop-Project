{% extends 'fleet_base1.html' %}
{% block content %}
<h2>Edit TimeSheet #{{ timesheet.timesheet_no }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <h3>Details</h3>
    {{ formset.management_form }}
    {% for form in formset %}
        <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px;">
            {{ form.as_p }}
        </div>
    {% endfor %}
    <button type="submit">Save</button>
</form>
{% endblock %}
