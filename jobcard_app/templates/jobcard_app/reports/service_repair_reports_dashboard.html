{% extends 'fleet_base1.html' %}
{% load static i18n %}

{% block content %}

<style>
    .jc-reports-page {
        padding: 20px 22px;
        background: #fff;
        min-height: 80vh;
    }

    /* PAGE HEADER */
    .jc-reports-heading {
        display: flex;
        align-items: center;
        gap: 15px;
        padding-bottom: 16px;
        border-bottom: 1px solid #e1e4e8;
        margin-bottom: 25px;
    }

    .jc-heading-icon {
        font-size: 32px;
        color: #c2185b;
    }

    .jc-reports-heading h2 {
        margin: 0;
        font-size: 25px;
        font-weight: 700;
        color: #23364a;
    }

    .jc-breadcrumb {
        margin-top: 5px;
        font-size: 13px;
        color: #8390a0;
    }

    .jc-breadcrumb a {
        color: #8390a0;
        text-decoration: none;
    }

    .jc-breadcrumb a:hover {
        color: #c2185b;
    }

    .jc-breadcrumb span {
        padding: 0 8px;
        color: #aab1ba;
    }

    /* SECTION HEADING */
    .jc-report-section {
        margin-bottom: 20px;
    }

    .jc-section-heading {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 15px;
        padding-left: 5px;
    }

    .jc-section-heading i {
        font-size: 19px;
        color: #c2185b;
    }

    .jc-section-heading h4 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: #202d3c;
    }

    /* REPORT GRID */
    .jc-report-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        row-gap: 14px;
        column-gap: 0;
    }

    /* REPORT LINK */
    .jc-report-link {
        min-width: 0;
        min-height: 55px;
        padding: 9px 13px;
        display: flex;
        align-items: center;
        gap: 13px;
        color: #172536;
        text-decoration: none !important;
        border-right: 1px solid #dfe3e8;
        transition: background .2s ease;
    }

    .jc-report-link:hover {
        background: #faf7f9;
        color: #c2185b;
    }

    .jc-report-link:hover .jc-report-name {
        color: #c2185b;
    }

    .jc-report-icon {
        width: 25px;
        flex-shrink: 0;
        text-align: center;
        font-size: 21px;
    }

    /* ICON COLORS */
    .jc-icon-pink {
        color: #c2185b;
    }

    .jc-icon-orange {
        color: #ff7900;
    }

    .jc-icon-blue {
        color: #2878df;
    }

    .jc-icon-green {
        color: #159c72;
    }

    .jc-icon-purple {
        color: #8954d8;
    }

    .jc-report-name {
        font-size: 13px;
        font-weight: 500;
        color: #172536;
        line-height: 1.35;
    }

    .jc-report-arrow {
        margin-left: auto;
        flex-shrink: 0;
        font-size: 12px;
        color: #65758a;
    }

    /* RESPONSIVE */
    @media (max-width: 1200px) {
        .jc-report-grid {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
    }

    @media (max-width: 900px) {
        .jc-report-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (max-width: 600px) {
        .jc-reports-page {
            padding: 15px 10px;
        }

        .jc-report-grid {
            grid-template-columns: 1fr;
            row-gap: 5px;
        }

        .jc-report-link {
            border-right: none;
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 10px;
        }

        .jc-reports-heading h2 {
            font-size: 21px;
        }
    }
</style>


<div class="jc-reports-page">

    <!-- PAGE HEADER -->
    <div class="jc-reports-heading" style="justify-content: space-between; flex-wrap: wrap;">

        <div style="display: flex; align-items: center; gap: 15px;">
            <i class="bi bi-tools jc-heading-icon"></i>
            <div>
                <h2>Service & Repair Reports</h2>
                <div class="jc-breadcrumb">
                    <a href="{% url 'fleet_app:fleet_home' %}">Home</a>
                    <span>›</span>
                    <a href="{% url 'jobcard_app:jobcard_reports_dashboard' %}">Reports Hub</a>
                    <span>›</span>
                    Service & Repair
                </div>
            </div>
        </div>

        <div>
            <a href="{% url 'jobcard_app:reports_category_dashboard' category_id='operations' %}" class="btn btn-sm" style="background: #f1f5f9; color: #76213b; border: 1px solid #cbd5e1; font-weight: 600; border-radius: 6px;">
                <i class="bi bi-arrow-left mr-1"></i> All Reports Hub
            </a>
        </div>

    </div>


    <!-- REPORT SECTION -->
    <div class="jc-report-section">

        <div class="jc-section-heading">
            <i class="bi bi-file-earmark-text"></i>
            <h4>SERVICE & REPAIR OVERVIEW</h4>
        </div>


        <div class="jc-report-grid">

            <!-- 1. SERVICE REGISTER -->
            <a href="{% url 'jobcard_app:service_register_report' %}"
               class="jc-report-link">

                <i class="bi bi-journal-text jc-report-icon jc-icon-pink"></i>

                <span class="jc-report-name">
                    Service Register
                </span>

                <i class="bi bi-chevron-right jc-report-arrow"></i>
            </a>


            <!-- 2. SERVICE DUE -->
            <a href="{% url 'jobcard_app:service_due_report' %}"
               class="jc-report-link">

                <i class="bi bi-calendar-check jc-report-icon jc-icon-orange"></i>

                <span class="jc-report-name">
                    Service Due Report
                </span>

                <i class="bi bi-chevron-right jc-report-arrow"></i>
            </a>


            <!-- 3. REPAIR REGISTER -->
            <a href="{% url 'jobcard_app:repair_register_report' %}"
               class="jc-report-link">

                <i class="bi bi-wrench-adjustable jc-report-icon jc-icon-blue"></i>

                <span class="jc-report-name">
                    Repair Register
                </span>

                <i class="bi bi-chevron-right jc-report-arrow"></i>
            </a>


            <!-- 4. REWORK REPORT -->
            <a href="{% url 'jobcard_app:rework_report' %}"
               class="jc-report-link">

                <i class="bi bi-arrow-repeat jc-report-icon jc-icon-purple"></i>

                <span class="jc-report-name">
                    Rework Report
                </span>

                <i class="bi bi-chevron-right jc-report-arrow"></i>
            </a>


        </div>

    </div>

</div>

{% endblock %}
